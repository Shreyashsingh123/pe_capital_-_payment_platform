# SonarQube project configuration.
# Replace the placeholder values below with the ones from your SonarQube project.

sonar.projectKey=pe_capital_payment_platform
sonar.projectName=PE Capital Payment Platform

# SonarQube Cloud only: uncomment and set your organization key.
# sonar.organization=your-organization-key

# What to analyze
sonar.sources=data-generation/src,data-generation/scripts,Databricks/notebooks,sql
sonar.sourceEncoding=UTF-8
sonar.python.version=3.11

# Skip generated state, secrets templates, images and docs
sonar.exclusions=**/__pycache__/**,**/venv/**,**/.pytest_cache/**,data-generation/data/**,data-generation/state/**,**/*.png,**/*.md
# Tests and coverage
sonar.tests=data-generation/tests
sonar.test.inclusions=data-generation/tests/**/*.py
sonar.python.coverage.reportPaths=data-generation/coverage.xml
# Tests and notebooks are not measured for coverage
sonar.coverage.exclusions=data-generation/tests/**,Databricks/notebooks/**
