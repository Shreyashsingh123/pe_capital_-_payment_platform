name: SonarQube
on:
  push:
    branches:
      - main
      - develop
      - sonarqube
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            data-generation/requirements.txt
            data-generation/requirements-dev.txt

      - name: Install dependencies
        working-directory: data-generation
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests with coverage
        working-directory: data-generation
        run: python -m pytest --cov=src --cov=scripts --cov-report=xml:coverage.xml --cov-report=term-missing

      # The Python Cobertura sensor resolves relative <source> entries against the
      # scanner working directory (repo root), but coverage.xml is generated in
      # data-generation, so make the sources repo-relative.
      - name: Make coverage paths repo-relative for Sonar
        working-directory: data-generation
        run: sed -i -E 's#<source>([^/<][^<]*)</source>#<source>data-generation/\1</source>#' coverage.xml

      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=rushikesh1093
            -Dsonar.projectKey=rushikesh1093_pe_capital_-_payment_platform
